{
"name": "Build APK",
"on": ["push", "workflow_dispatch"],
"permissions": {"contents": "write"},
"jobs": {"build": {
"runs-on": "ubuntu-latest",
"steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"uses": "gradle/actions/setup-gradle@v4"},
{"name": "Build debug APK", "run": "chmod +x gradlew && ./gradlew assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk VoxAlarm.apk"},
{"name": "Upload artifact", "uses": "actions/upload-artifact@v4", "with": {"name": "VoxAlarm-apk", "path": "VoxAlarm.apk"}},
{"name": "Publish release", "env": {"GH_TOKEN": "${{ github.token }}"}, "run": "gh release view latest || gh release create latest --title 'VoxAlarm (latest build)' --notes 'Download VoxAlarm.apk on your phone and tap it to install.'; gh release upload latest VoxAlarm.apk --clobber"}
]
}}
}
